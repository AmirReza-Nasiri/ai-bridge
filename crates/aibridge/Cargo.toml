[package]
name = "aibridge"
description = "Keeps Codex warm as a fast peer reviewer for Claude Code — an automatic plan gate + Stop review gate, on-demand consult, and self-update."
keywords = ["claude", "codex", "mcp", "code-review", "ai"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aibridge"
path = "src/main.rs"

[dependencies]
aibridge-core = { path = "../aibridge-core" }
aibridge-platform = { path = "../aibridge-platform" }
clap = { workspace = true }
anyhow = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true } # read the live review-status Value in the `tui` dashboard
