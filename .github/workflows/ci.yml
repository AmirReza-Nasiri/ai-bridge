name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Native build + test on each available runner (Windows, macOS Apple Silicon,
  # Linux). macOS Intel is covered separately via cross-compile (see below),
  # because GitHub-hosted Intel runners (macos-13) are being sunset and queue
  # indefinitely.
  test:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --release --workspace
      - name: Test
        run: cargo test --workspace

  # macOS Intel (x86_64-apple-darwin) coverage WITHOUT a macos-13 runner:
  # cross-compile + lint the Intel target on the Apple Silicon runner. This keeps
  # Intel build coverage green reliably; runtime verification on real Intel
  # hardware is a manual step (see MAINTAINERS.md) when needed.
  macos-intel-crosscheck:
    name: macOS Intel (x86_64) cross-compile on Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (x86_64-apple-darwin)
        run: cargo clippy --target x86_64-apple-darwin --all-targets --all-features -- -D warnings
      - name: Build (x86_64-apple-darwin)
        run: cargo build --release --target x86_64-apple-darwin --workspace
      - name: Test compile (x86_64-apple-darwin, no-run)
        # Catches Intel test-compile errors without claiming runtime coverage;
        # real Intel runtime is a manual release-time check (see MAINTAINERS.md).
        run: cargo test --target x86_64-apple-darwin --workspace --no-run
