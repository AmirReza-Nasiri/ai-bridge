[workspace]
resolver = "2"
members = [
    "crates/aibridge",
    "crates/aibridge-core",
    "crates/aibridge-platform",
]

[workspace.package]
version = "0.23.0"
edition = "2021"
rust-version = "1.82"
authors = ["AmirReza", "Mohammad (Mo)"]
license = "MIT"
repository = "https://github.com/omega-do-it-solutions/ai-bridge"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
which = "7"
ratatui = "0.29" # interactive terminal dashboard (`aibridge tui`); re-exports crossterm

[profile.release]
lto = "thin"
strip = "symbols"
